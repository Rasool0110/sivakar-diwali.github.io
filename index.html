<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Sivakar - Diwali Crackers 2026</title>
    <style>
        :root{color-scheme:light dark;--bg:light-dark(#fffaf2,#17120d);--s:light-dark(#fff,#211912);--s2:light-dark(#fff3df,#2a2018);--t:light-dark(#2a1a0d,#fff7ee);--m:light-dark(#76675a,#cdbca9);--a:light-dark(#d94801,#ff9b3d);--b:light-dark(#ead8c4,#49362a)}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--t)}#app{min-height:100vh;background:var(--bg)}header{background:linear-gradient(135deg,#8f1d0c,#d94801 55%,#f59e0b);color:#fff;padding:20px 16px 16px;position:sticky;top:0;z-index:20;box-shadow:0 3px 20px #0003}.top,.search,main,.bottomin{max-width:1180px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand h1{font-size:24px;margin:0;font-weight:850}.brand p{margin:4px 0 0;font-size:13px;opacity:.9}.search{display:flex;gap:8px;margin-top:13px}.search input{flex:1;border:0;border-radius:13px;padding:12px 14px;font-size:15px;background:#fff;color:#2a1a0d}.cartbtn,.primary,.secondary{border-radius:13px;padding:11px 14px;font-weight:800;cursor:pointer}.cartbtn{border:0;background:#fff;color:#8f1d0c}.primary{border:0;background:var(--a);color:#fff}.secondary{border:1px solid var(--b);background:var(--s);color:var(--t)}main{padding:16px}.chips{display:flex;gap:7px;overflow:auto;padding:2px 0 13px;scrollbar-width:none}.chip{border:1px solid var(--b);background:var(--s);color:var(--t);padding:8px 12px;border-radius:999px;white-space:nowrap;cursor:pointer}.chip.active{background:var(--a);color:#fff;border-color:var(--a)}.meta{display:flex;justify-content:space-between;align-items:center;margin:3px 0 13px;color:var(--m);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:var(--s);border:1px solid var(--b);border-radius:17px;overflow:hidden}.pic{height:140px;background:var(--s2);display:flex;align-items:center;justify-content:center}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:11px}.cat{font-size:10px;color:var(--a);font-weight:800;text-transform:uppercase}.name{font-size:14px;font-weight:760;line-height:1.25;margin:5px 0;min-height:35px}.unit{font-size:11px;color:var(--m)}.price{font-size:18px;font-weight:850;margin:7px 0}.controls{display:flex;align-items:center;justify-content:space-between;gap:6px}.qty{display:flex;align-items:center;border:1px solid var(--b);border-radius:11px;overflow:hidden}.qty button{border:0;background:var(--s2);color:var(--t);width:32px;height:32px;font-size:18px;cursor:pointer}.qty span{min-width:28px;text-align:center;font-weight:800}.line{font-size:11px;color:var(--m)}.empty{text-align:center;color:var(--m);padding:40px;grid-column:1/-1}.bottom{position:sticky;bottom:0;background:color-mix(in srgb,var(--s) 94%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--b);padding:10px 16px;z-index:15}.bottomin{display:flex;justify-content:space-between;align-items:center;gap:10px}.total{font-size:12px;color:var(--m)}.total strong{font-size:21px;color:var(--t)}.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50;padding:14px;align-items:flex-end;justify-content:center}.overlay.show{display:flex}.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:var(--s);border-radius:22px 22px 10px 10px;padding:19px}.close{float:right;border:0;background:var(--s2);color:var(--t);border-radius:50%;width:32px;height:32px;cursor:pointer}.modal h2{margin:0 0 5px}.notice{font-size:12px;color:var(--m);line-height:1.5}.summary{background:var(--s2);padding:11px;border-radius:13px;margin:12px 0}.row{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:13px}.row.totalrow{border-top:1px solid var(--b);margin-top:6px;padding-top:9px;font-weight:850;font-size:16px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:13px 0}.fields input,.fields textarea{width:100%;padding:11px;border:1px solid var(--b);border-radius:11px;background:var(--s2);color:var(--t);font:inherit}.fields textarea{grid-column:1/-1;min-height:65px}.actions{display:flex;gap:7px;flex-wrap:wrap}.orderdone{display:none}.orderdone.show{display:block}.orderid{font-size:24px;font-weight:900;color:var(--a)}@media(max-width:900px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:640px){header{padding:15px 11px}.brand h1{font-size:19px}.search .cartbtn{display:none}main{padding:11px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.pic{height:120px}.body{padding:9px}.name{font-size:13px}.price{font-size:16px}.bottom{padding:9px 11px}.fields{grid-template-columns:1fr}.fields textarea{grid-column:auto}}@media print{header,.chips,.meta,.grid,.bottom{display:none!important}.overlay{display:flex!important;position:static;background:none;padding:0}.modal{box-shadow:none;max-height:none;width:100%;border-radius:0}.close,.actions,.notice{display:none!important}.orderdone{display:block!important}}
    </style>
</head>
<body>
<div id="app">
    <header>
        <div class="top">
            <div class="brand"><h1>🎆 SIVAKAR</h1><p>Diwali Crackers 2026 • Browse • Select quantity • Place your order</p></div>
            <button class="cartbtn" onclick="openCart()">🛒 <span id="cartCount">0</span> items</button>
        </div>
        <div class="search">
            <input id="search" placeholder="Search crackers…" oninput="render()">
            <button class="cartbtn" onclick="openCart()">View Order</button>
        </div>
    </header>
    <main>
        <div id="chips" class="chips"></div>
        <div class="meta"><span id="count"></span><button class="secondary" onclick="clearCart()">Clear quantities</button></div>
        <div id="grid" class="grid"></div>
    </main>
    <div class="bottom">
        <div class="bottomin">
            <div class="total">Order total<br><strong>₹<span id="grand">0</span></strong></div>
            <button class="primary" onclick="openCart()">Review & Place Order →</button>
        </div>
    </div>
</div>

<div id="overlay" class="overlay" onclick="if(event.target===this)closeCart()">
    <div class="modal">
        <button class="close" onclick="closeCart()">×</button>
        <div id="checkout">
            <h2>Your Order</h2>
            <p class="notice">Product details and prices are fixed by the shop. Customer can change quantities only.</p>
            <div id="summary" class="summary"></div>
            <div class="fields">
                <input id="customer" placeholder="Customer name *">
                <input id="phone" placeholder="Mobile number *" inputmode="tel">
                <textarea id="address" placeholder="Delivery address / pickup note"></textarea>
                <input id="shopwa" placeholder="Shop WhatsApp number, e.g. 9198XXXXXXXX" value="">
            </div>
            <div class="actions">
                <button class="primary" onclick="placeOrder()">Place Order</button>
                <button class="secondary" onclick="copyOrder()">Copy Order</button>
                <button class="secondary" onclick="printInvoice()">Print / Save PDF</button>
            </div>
        </div>
        <div id="done" class="orderdone">
            <h2>🎉 Order Created</h2>
            <p>Your order ID is</p>
            <div class="orderid" id="orderId"></div>
            <div id="doneSummary" class="summary"></div>
            <div class="actions">
                <button class="primary" onclick="sendWhatsApp()">Send on WhatsApp</button>
                <button class="secondary" onclick="printInvoice()">Print / Save PDF</button>
                <button class="secondary" onclick="closeCart()">Continue Shopping</button>
            </div>
        </div>
    </div>
</div>

<script>
const DATA = {
    "products": [
        {"id": 1, "category": "Sparklers", "name": "7 Cm Electric Sparklers", "unit": "BOX", "price": 10.0},
        {"id": 2, "category": "Sparklers", "name": "7 Cm Colour Sparklers", "unit": "BOX", "price": 12.0},
        {"id": 3, "category": "Sparklers", "name": "7 Cm Green Sparklers", "unit": "BOX", "price": 14.0},
        {"id": 4, "category": "Sparklers", "name": "7 Cm Red Sparklers", "unit": "BOX", "price": 16.0}
    ]
};

let cart = {};
let activeCategory = "All";

function init() {
    const categories = ["All", ...new Set(DATA.products.map(p => p.category))];
    const chipsDiv = document.getElementById("chips");
    chipsDiv.innerHTML = categories.map(cat => 
        `<div class="chip ${cat === activeCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</div>`
    ).join('');
    render();
}

function setCategory(cat) {
    activeCategory = cat;
    init();
}

function updateQty(id, change) {
    cart[id] = (cart[id] || 0) + change;
    if (cart[id] <= 0) delete cart[id];
    render();
}

function clearCart() {
    cart = {};
    render();
}

function render() {
    const query = document.getElementById("search").value.toLowerCase();
    const filtered = DATA.products.filter(p => {
        const matchesCat = activeCategory === "All" || p.category === activeCategory;
        const matchesSearch = p.name.toLowerCase().includes(query);
        return matchesCat && matchesSearch;
    });

    document.getElementById("count").innerText = `Showing ${filtered.length} products`;

    const grid = document.getElementById("grid");
    if(filtered.length === 0) {
        grid.innerHTML = `<div class="empty">No products found matching "${query}"</div>`;
    } else {
        grid.innerHTML = filtered.map(p => {
            const qty = cart[p.id] || 0;
            return `
                <div class="card">
                    <div class="pic">🎆</div>
                    <div class="body">
                        <div class="cat">${p.category}</div>
${p.name}
Per ${p.unit}
₹${p.price}


-
${qty}
+




`;
}).join('');
}
let totalItems = 0;
let grandTotal = 0;
Object.keys(cart).forEach(id => {
const prod = DATA.products.find(p => p.id == id);
if(prod) {
totalItems += cart[id];
grandTotal += (prod.price * cart[id]);
}
});
document.getElementById("cartCount").innerText = totalItems;
document.getElementById("grand").innerText = grandTotal;
}
function openCart() {
let grandTotal = 0;
const summary = document.getElementById("summary");
let html = Object.keys(cart).map(id => {
const prod = DATA.products.find(p => p.id == id);
const itemTotal = prod.price * cart[id];
grandTotal += itemTotal;
return <div class="row"><span>${prod.name} x ${cart[id]}</span><span>₹${itemTotal}</span></div>;
}).join('');
if(!html) html = 'No items in order';
html += <div class="row totalrow"><span>Total</span><span>₹${grandTotal}</span></div>;
summary.innerHTML = html;
document.getElementById("checkout").style.display = "block";
document.getElementById("done").style.display = "none";
document.getElementById("overlay").classList.add("show");
}
function closeCart() {
document.getElementById("overlay").classList.remove("show");
}
function placeOrder() {
const name = document.getElementById("customer").value;
const phone = document.getElementById("phone").value;
if(!name || !phone) return alert("Please fill in Customer Name and Mobile Number!");
document.getElementById("orderId").innerText = "SK-" + Math.floor(100000 + Math.random() * 900000);
document.getElementById("doneSummary").innerHTML = document.getElementById("summary").innerHTML;
document.getElementById("checkout").style.display = "none";
document.getElementById("done").style.display = "block";
}
function sendWhatsApp() {
const waNum = document.getElementById("shopwa").value || "919876543210";
const orderId = document.getElementById("orderId").value;
const text = encodeURIComponent(Hello, I want to place an order!);
window.open(https://wa.me{waNum}?text=${text}, '_blank');
}
function copyOrder() {
navigator.clipboard.writeText("Order details copied!");
alert("Copied to clipboard!");
}
function printInvoice() {
window.print();
}
window.onload = init;
